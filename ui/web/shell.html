<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Plushie Merge</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}
#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}
#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}
#status-splash.show-image--false {
	display: none;
}
#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}
#status-splash.use-filter--false {
	image-rendering: pixelated;
}
#status-progress, #status-notice {
	display: none;
}
#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: "Noto Sans SC", sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f5e8de; font-family:"Noto Sans SC",sans-serif; }
#canvas { position:fixed; left:env(safe-area-inset-left); top:env(safe-area-inset-top); width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)) !important; height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important; display:block; outline:none; touch-action:none; }
#status { background:#f5e8de; color:#593c49; font:64px/1.6 "Noto Sans SC";font-synthesis:none; }
#status-splash { max-width:192px; object-fit:contain; }
html,body{overscroll-behavior:none;overflow:hidden;width:100%;height:100%;margin:0}
#safe-area-probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mobile-device #canvas,.portrait-layout #canvas{left:var(--mushies-viewport-left,0px)!important;top:var(--mushies-viewport-top,0px)!important;width:var(--mushies-viewport-width,100vw)!important;height:var(--mushies-viewport-height,100dvh)!important}
.mobile-device #status,.portrait-layout #status{font-size:22px}
#portrait-guard{position:fixed;inset:0;z-index:100;background:#f8ecdf;color:#593c49;font:20px/1.5 "Noto Sans SC";display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#portrait-guard[hidden]{display:none}
#portrait-guard>div{max-width:520px}
#portrait-guard h1{font-size:32px;margin:0 0 12px}
#portrait-guard p{margin:0 0 20px}
#portrait-action{font:inherit;min-height:48px;padding:10px 22px;border:1px solid #b5859d;border-radius:12px;background:#ebacb7;color:#593c49;cursor:pointer}
#portrait-action:focus-visible{outline:3px solid #795c7d;outline-offset:4px}
#resize-ended-banner{position:fixed;left:calc(var(--mushies-viewport-left,0px) + 12px);top:calc(var(--mushies-viewport-top,0px) + max(12px,env(safe-area-inset-top)));width:calc(var(--mushies-viewport-width,100vw) - 24px);box-sizing:border-box;z-index:110;padding:12px 16px;border:3px solid #ffc47b;border-radius:12px;background:#7f263e;color:#fff8ed;text-align:center;font:700 clamp(20px,3.5vw,36px)/1.3 "Noto Sans SC";pointer-events:none}
#resize-ended-banner[hidden]{display:none}
/* The shell owns the whole viewport; never inherit Godot's stock 64px status styling. */
#status{position:fixed;inset:0;background:#f5e8de}
#status-splash,#status-progress,#status-notice{display:none!important}
#mushies-loader{position:fixed;inset:0;z-index:20;isolation:isolate;box-sizing:border-box;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#fff8eb 0%,#f7e9de 65%,#eddace 100%);color:#593c49;font:16px/1.4 "Noto Sans SC";touch-action:none}
#mushies-loader[hidden]{display:none!important}
#mushies-loader-ducks{position:absolute;inset:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden;pointer-events:none}

#mushies-loader-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(22px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));box-sizing:border-box;pointer-events:none}
#mushies-loader-message{max-width:100%;margin:0;padding:.16em .35em;border-radius:.25em;background:rgba(255,248,237,.82);color:#593c49;font-size:clamp(36px,9vw,112px);line-height:1.1;font-weight:900;letter-spacing:.025em;text-align:center;text-shadow:0 3px 0 rgba(255,255,255,.8);box-shadow:0 5px 25px rgba(90,60,60,.06);animation:mushies-loading-breathe 2s ease-in-out infinite}
#mushies-loader-detail{max-width:32em;margin:0;text-align:center;font-size:16px;line-height:1.5}
#mushies-loader-detail[hidden],#mushies-loader-retry[hidden]{display:none!important}
#mushies-loader-progress{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#mushies-loader-retry{min-height:48px;padding:12px 26px;border:2px solid #795c7d;border-radius:16px;background:#ebacb7;color:#593c49;font-family:inherit;font-size:18px;font-weight:700;line-height:1.2;cursor:pointer;pointer-events:auto}

#mushies-loader[data-state="failure"] #mushies-loader-card{background:rgba(255,248,237,.94)}

@media (prefers-reduced-motion:reduce){#mushies-loader .mushies-loader-duck,#mushies-loader-message{animation:none}}
@media (max-height:360px){#mushies-loader-message{font-size:clamp(32px,12vh,64px)}#mushies-loader-card{gap:8px}}

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';
	function setStatusMode(mode) {
        if (statusMode === mode || !initializing) {
            return;
        }
        if (mode === 'hidden') {
            // The engine is ready; briefly finish the final bounded duck drop.
            statusMode = mode;
            const finished = window.MushiesLoader?.ready();
            Promise.resolve(finished).then((completed) => {
                if (completed === false || !initializing || statusMode !== 'hidden') return;
                statusOverlay.remove();
                initializing = false;
            });
            return;
        }
        statusOverlay.style.visibility = 'visible';
        // The custom shell owns visible progress and player-facing errors.
        statusProgress.style.display = 'none';
        statusNotice.style.display = 'none';
        statusMode = mode;
    }
	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}
	function displayFailureNotice(err) {

        console.error(err);

        setStatusMode('notice');

                },

                setStatusMode('hidden');
